name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pages-build
          MYSQL_DATABASE: petali_e_fiori
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppages-build"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
      - name: Seed build database
        run: npm run seed
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: petali_e_fiori
          DB_USER: root
          DB_PASSWORD: pages-build
      - name: Build static site
        run: npm run build:preview -- --base=/petali-e-fiori/
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: petali_e_fiori
          DB_USER: root
          DB_PASSWORD: pages-build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
